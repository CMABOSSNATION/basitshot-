<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basitshot | Modern Streaming</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

    <nav class="sidebar">
        <h2 class="logo">BASIT<span>SHOT</span></h2>
        <ul>
            <li class="active"><i class='bx bxs-home'></i> Home</li>
            <li><i class='bx bxs-playlist'></i> Playlists</li>
            <li><i class='bx bxs-user-voice'></i> Artists</li>
        </ul>
    </nav>

    <div class="main-container">
        <header class="featured-artist">
            <div class="artist-info">
                <span class="badge">Verified Artist</span>
                <h1>Cyber Muzik</h1>
                <p>1.2M Monthly Listeners</p>
                <div class="hero-actions">
                    <button class="btn play-btn-main">Play All</button>
                    <button class="btn follow-btn">Follow</button>
                </div>
            </div>
        </header>

        <section class="music-section">
            <h2>New Releases</h2>
            <div class="music-grid">
                <div class="track-card" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
                    <div class="cover-container">
                        <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300&h=300&fit=crop" alt="Album Cover">
                        <div class="play-overlay">
                            <i class='bx bx-play play-icon'></i>
                        </div>
                    </div>
                    <h3>Night City</h3>
                    <p>Synthwave Art</p>
                </div>

                <div class="track-card" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">
                    <div class="cover-container">
                        <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300&h=300&fit=crop" alt="Album Cover">
                        <div class="play-overlay">
                            <i class='bx bx-play play-icon'></i>
                        </div>
                    </div>
                    <h3>Golden Hour</h3>
                    <p>Chill Lo-Fi</p>
                </div>
            </div>
        </section>
    </div>

    <audio id="main-audio" src=""></audio>

    <div class="player-bar">
        <div class="song-details">
            <div class="mini-thumb"></div>
            <div>
                <div class="current-title">Select a Song</div>
                <div class="current-artist">Artist</div>
            </div>
        </div>
        <div class="player-controls">
            <i class='bx bx-skip-previous'></i>
            <i class='bx bx-play-circle' id="master-play"></i>
            <i class='bx bx-skip-next'></i>
        </div>
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
